# ==========================================
#  TMUX CONFIGURATION (Optimized for Neovim & AI)
# ==========================================

# --- PREFIX KEY ---
# Change prefix from Ctrl-b to Ctrl-a (much easier to reach on Muggle keyboards)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- GENERAL SETTINGS ---
# Set history limit high (essential for scrolling back through long AI generations or code dumps)
set -g history-limit 50000

# Enable mouse support (great for quick scrolling, clicking panes, and resizing)
set -g mouse on

# Start window and pane numbering at 1 (makes switching with keyboard numbers way more intuitive)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Keep window names clean (don't let them auto-rename based on active command constantly)
set -g allow-rename off

# --- NEOVIM INTEGRATION & PERFORMANCE ---
# Remove delay when pressing Esc (absolutely crucial for Neovim, otherwise modal switching lags)
set -sg escape-time 0

# Enable focus events (needed for Neovim's 'autoread' to update files changed outside the editor)
set -g focus-events on

# Ensure 24-bit True Color support (vital for Neovim themes like Catppuccin, Tokyo Night, etc.)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- PANE MANAGEMENT & SPLITTING ---
# Split panes using | and - (and ensure they open in the current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane selection (interoperable with Neovim layouts)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easy pane resizing (Ctrl + Vim keys)
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# --- COPY MODE (Vim style) ---
# Use Vi keys in copy mode (great for navigating terminal output quickly)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- THEME & STATUS BAR (Catppuccin Mocha Inspired Minimalist Dark) ---
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side of status bar (Session name)
set -g status-left-length 50
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] 󰘧 #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right side of status bar (Time & Date, host)
set -g status-right-length 100
set -g status-right "#[fg=#bac2de]󰃭 %Y-%m-%d 󱑒 %H:%M #[bg=#a6e3a1,fg=#11111b,bold] 󰉋 ATOM's Manor "

# Window status tabs
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7]#[fg=#11111b,bg=#cba6f7,bold] #I:#W #[fg=#cba6f7,bg=#1e1e2e]"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# --- EASY RELOAD ---
# Reload configuration file on prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# --- PLUGIN MANAGER (TPM) ---
# Zainstalowany przez: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Po edycji: prefix + r (reload), potem prefix + I (zainstaluj/aktualizuj wtyczki)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: zapisuj tez zawartosc paneli (przydatne przy dlugim AI output)
set -g @resurrect-capture-pane-contents 'on'
# Reczny zapis / przywracanie: prefix + S / prefix + R
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Continuum: auto-zapis co 15 min i auto-przywracanie ostatniej sesji po starcie tmux (czyli po reboot)
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- TPM BOOTSTRAP (musi byc OSTATNIA linia) ---
run '~/.tmux/plugins/tpm/tpm'
